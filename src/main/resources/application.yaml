server:
  port: 8081

spring:
  application:
    name: hmdp

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hmdp?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  data:
    redis:
      host: 192.168.12.168
      port: 6379
      database: 0
      password:
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          max-wait: -1ms

  jackson:
    default-property-inclusion: non_null
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

  # Spring AI OpenAI configuration
  ai:
    model:
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode  # base-url 必须在 openai 级别
      chat:
        options:
          model: ${OPENAI_MODEL:GLM-5}
          temperature: 0.7
      # 多模态模型配置（用于图片分析）
      multimodal:
        api-key: ${OPENAI_API_KEY:}
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        options:
          model: qwen3.5-plus  # 使用支持图片输入的多模态模型
          temperature: 0.7

mybatis-plus:
  type-aliases-package: com.hmdp.entity
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.hmdp: debug
  pattern:
    dateformat: HH:mm:ss.SSS

# MinIO 配置
minio:
  endpoint: http://192.168.12.168:9000  # MinIO 服务地址
  access-key: adminadmin           # 访问密钥
  secret-key: adminadmin           # 秘密密钥
  bucket-name: hmdp                      # 存储桶名称

# Sa-Token 配置
sa-token:
  token-name: authorization        # token 名称（同时也是cookie名称）
  timeout: 2592000                 # token 有效期（单位：秒），默认30天
  active-timeout: -1               # token 临时有效期（指定时间无操作则过期）
  is-concurrent: true              # 是否允许同一账号并发登录
  is-share: true                   # 多人登录同一账号时，是否共用一个token
  token-style: uuid                # token 风格
  is-log: false                    # 是否输出操作日志
